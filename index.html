<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Separação de Mercadorias</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #f8fafc;
            --border: #e2e8f0;
            --secondary: #64748b;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 95vw;
            overflow-x: auto;
            min-height: 100vh;
            margin: 0;
            background: var(--bg);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            min-width: 400px;
        }

        header {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        table {
            border-collapse: collapse;
            margin-bottom: 10px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 6px;
            text-align: center;
        }

        th {
            background: #f1f5f9;
            font-size: 11px;
            text-transform: uppercase;
            color: #64748b;
        }

        input {
            width: 65px;
            height: 32px;
            border: 1px solid #cbd5e1;
            text-align: center;
            border-radius: 6px;
            font-weight: 600;
        }

        .input-cod {
            background: #fffbeb;
            border-color: #fde68a;
            color: #92400e;
            width: 85px;
        }

        .input-total {
            background: #f1f5f9;
            color: var(--primary);
            border-style: dashed;
        }

        .row-store-label {
            text-align: right;
            padding-right: 20px;
            font-weight: bold;
            color: #334155;
            background: #f8fafc;
            min-width: 120px;
        }

        .row-total-label { background: #f1f5f9; font-weight: bold; color: var(--primary); }
        .row-restante-label { background: #f8fafc; font-weight: bold; color: #334155; }

        .input-restante {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            cursor: not-allowed;
        }

        /* ESTILIZAÇÃO DOS BOTÕES */
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn-add { background: var(--primary); color: white; }
        .btn-print { background: var(--secondary); color: white; }
        
        .btn-clear-last { 
            background: var(--warning); 
            color: white; 
            margin-left: auto; /* Empurra para a direita */
        }

        .btn-clear { background: var(--danger); color: white; }

        @media print {
            .no-print, .btn, header { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            .container { box-shadow: none; border: none; width: 100%; display: block; }
            table { zoom: 0.9; width: 100%; }
        }
    </style>
</head>

<body>

    <div class="container">
        <header class="no-print">
            <h2 style="margin-right: 15px; font-size: 1.1rem; color: #0f172a;">Separação</h2>
            
            <button class="btn btn-add" onclick="addColumn()">
                <span>➕</span> Novo Produto
            </button>
            
            <button class="btn btn-print" onclick="window.print()">
                <span>🖨️</span> Imprimir
            </button>
            
            <button class="btn btn-clear-last" onclick="removeLastColumn()">
                <span>↩️</span> Desfazer Último
            </button>
            
            <button class="btn btn-clear" onclick="clearData()">
                <span>🗑️</span> Limpar Tudo
            </button>
        </header>

        <table id="mainTable">
            <thead>
                <tr id="header-cod">
                    <th>LOJAS</th>
                </tr>
            </thead>
            <tbody id="storeRows">
                <tr data-store="Matriz"><td class="row-store-label">Matriz</td></tr>
                <tr data-store="Palhano"><td class="row-store-label">Palhano</td></tr>
                <tr data-store="Jaguaruana"><td class="row-store-label">Jaguaruana</td></tr>
                <tr data-store="Loja 05"><td class="row-store-label">Loja 05</td></tr>
                <tr data-store="Limoeiro"><td class="row-store-label">Limoeiro</td></tr>
                <tr data-store="Itaicaba"><td class="row-store-label">Itaicaba</td></tr>
                <tr data-store="Flores"><td class="row-store-label">Flores</td></tr>
                <tr data-store="Aracati"><td class="row-store-label">Aracati</td></tr>
            </tbody>
            <tfoot>
                <tr id="footer-total"><td class="row-total-label">TOTAL NOTA</td></tr>
                <tr id="footer-restante"><td class="row-restante-label">RESTANTE</td></tr>
            </tfoot>
        </table>
    </div>

    <script>
        window.onload = function() {
            addColumn();
        };

        function addColumn() {
            const header = document.getElementById('header-cod');
            const th = document.createElement('th');
            th.innerHTML = '<input type="text" class="input-cod" placeholder="CÓD">';
            header.appendChild(th);

            const rows = document.getElementById('storeRows').rows;
            for (let i = 0; i < rows.length; i++) {
                const td = rows[i].insertCell(-1);
                td.innerHTML = '<input type="number" class="qty-input" value="0" oninput="calculateColumn(' + (header.cells.length - 1) + ')">';
            }

            const fTotal = document.getElementById('footer-total');
            const tdT = fTotal.insertCell(-1);
            tdT.innerHTML = '<input type="number" class="input-total" value="0" oninput="calculateColumn(' + (header.cells.length - 1) + ')">';

            const fRest = document.getElementById('footer-restante');
            const tdR = fRest.insertCell(-1);
            tdR.innerHTML = '<input type="number" class="input-restante" value="0" readonly>';
        }

        function removeLastColumn() {
            const headerRow = document.getElementById('header-cod');
            if (headerRow.cells.length > 1) {
                if (confirm('Remover o último produto e todos os seus valores?')) {
                    const table = document.getElementById('mainTable');
                    const allRows = table.querySelectorAll('tr');
                    allRows.forEach(row => {
                        if (row.cells.length > 1) row.deleteCell(-1);
                    });
                }
            } else {
                alert('Não há produtos para remover.');
            }
        }

        function calculateColumn(colIndex) {
            const rows = document.getElementById('storeRows').rows;
            let sum = 0;
            for (let i = 0; i < rows.length; i++) {
                sum += parseFloat(rows[i].cells[colIndex].querySelector('input').value) || 0;
            }

            const totalNota = parseFloat(document.getElementById('footer-total').cells[colIndex].querySelector('input').value) || 0;
            const restanteInput = document.getElementById('footer-restante').cells[colIndex].querySelector('input');
            
            const diff = totalNota - sum;
            restanteInput.value = diff;

            if (diff === 0 && totalNota > 0) {
                restanteInput.style.color = "var(--success)";
                restanteInput.style.borderColor = "var(--success)";
            } else if (diff < 0) {
                restanteInput.style.color = "var(--danger)";
                restanteInput.style.borderColor = "var(--danger)";
            } else {
                restanteInput.style.color = "var(--primary)";
                restanteInput.style.borderColor = "var(--border)";
            }
        }

        function clearData() {
            if (confirm('ATENÇÃO: Isso apagará TODOS os produtos e dados da tela. Deseja continuar?')) {
                location.reload();
            }
        }
    </script>
</body>
</html>
